name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the node:22 base image in the Dockerfile.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  postgres:
    # The main test suite runs on SQLite; this runs the database-specific search tests on
    # PostgreSQL with pgvector, as used by PostgreSQL deployments.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audiosense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/audiosense_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Enable pgvector
        run: psql "$TEST_POSTGRES_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Keyword search tests (PostgreSQL)
        run: node --import tsx --test tests/keyword-search.test.ts

  python-runtime:
    # Runtime logic (live-mode recorder, protocol, model manager) with the base dependencies;
    # the tests stub out models, VAD and GPU work.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e . httpx

      - name: Test
        run: python -m unittest discover -s tests -v
